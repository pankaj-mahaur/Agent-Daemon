# Release agent-daemon-memory (P5.4, MCP launch plan L3 Decision 24): the npm
# package and the host packages.
#
# Runs only when the owner dispatches it. `dry_run` (the default) builds, checks
# and uploads every artifact with SHA256SUMS, and publishes nothing. The build is
# one script (runtime/scripts/release-memory-build.mjs), so a local run of it is a
# dry run of this job. A real run needs the `release-memory` environment's approval,
# refuses while the product still has its old name unless `legacy_name` is set
# (owner checkpoint C-L3-NAME), and then:
#   - npm publish --provenance --tag <dist_tag> through npm's trusted publisher
#     (OIDC: this repo, release-memory.yml, environment release-memory; no token is stored)
#   - the product repository's tree (marketplace + README) → vars.PRODUCT_REPO (secret PRODUCT_DEPLOY_KEY)
#   - a shell-form build of the plugin → vars.MEMORY_MARKETPLACE_REPO (secret MARKETPLACE_DEPLOY_KEY),
#     where 3.1.0's plugin users update from (Claude Code before 2.1.314 may ignore exec-form args)
#   - the Gemini extension tree → vars.MEMORY_GEMINI_REPO (secret GEMINI_DEPLOY_KEY)
#   - a GitHub release memory-v<version> with every artifact and SHA256SUMS
# A target whose secret or repository isn't set is skipped, with a notice.
# Nothing here runs on push or tag. Dispatch inputs reach scripts through env, never inline.

name: release memory

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check only; publish nothing"
        type: boolean
        default: true
      dist_tag:
        description: "npm dist-tag (beta: npx agent-daemon-memory@beta)"
        type: choice
        options:
          - beta
          - latest
        default: beta
      legacy_name:
        description: "Allow a real release under the old name agent-daemon-memory (C-L3-NAME)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: build and check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: runtime/package-lock.json

      - name: The release name (C-L3-NAME)
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          LEGACY_NAME: ${{ inputs.legacy_name }}
        run: node runtime/scripts/release-name-gate.mjs

      - name: Install runtime deps
        working-directory: runtime
        run: npm ci

      - name: Registry signatures of the installed dependencies
        working-directory: runtime
        run: npm audit signatures

      - name: Package, host-package and release tests
        working-directory: runtime
        env:
          AD_SQLITE_DRIVER: node:sqlite
        run: node --test --test-force-exit test/host-packages.test.mjs test/memory-package.test.mjs test/listings.test.mjs test/tools-list.test.mjs test/release-memory-workflow.test.mjs

      - name: Build every artifact
        id: build
        env:
          PRODUCT_REPO: ${{ vars.PRODUCT_REPO }}
        run: node runtime/scripts/release-memory-build.mjs --out "$RUNNER_TEMP/out"

      - name: Upload the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-daemon-memory-${{ steps.build.outputs.version }}
          path: |
            ${{ runner.temp }}/out/dist
            ${{ runner.temp }}/out/hosts
            ${{ runner.temp }}/out/hosts-legacy
            ${{ runner.temp }}/out/listing
          if-no-files-found: error

  publish:
    name: publish (owner-approved)
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: release-memory
    permissions:
      contents: write
      id-token: write
    env:
      V: ${{ needs.build.outputs.version }}
      DIST_TAG: ${{ inputs.dist_tag }}
    steps:
      - name: Download the artifacts
        uses: actions/download-artifact@v4
        with:
          name: agent-daemon-memory-${{ needs.build.outputs.version }}
          path: out

      - name: Check the downloads against SHA256SUMS
        working-directory: out/dist
        run: sha256sum --check --strict SHA256SUMS

      # Trusted publishing (OIDC, id-token: write above) needs npm 11.5.1 or later; Node 24 ships it.
      - name: Setup Node.js 24 for npm
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: npm publish
        run: |
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); if (a*1e6+b*1e3+c < 11005001) { console.error(`::error::npm ${process.argv[1]} cannot use the trusted publisher (needs 11.5.1+)`); process.exit(1); }' "$(npm --version)"
          case "$DIST_TAG" in beta|latest) ;; *) echo "::error::unknown dist_tag $DIST_TAG"; exit 1 ;; esac
          npm publish "out/dist/agent-daemon-memory-$V.tgz" --provenance --access public --tag "$DIST_TAG"

      - name: Push the product repository's tree
        env:
          KEY: ${{ secrets.PRODUCT_DEPLOY_KEY }}
          REPO: ${{ vars.PRODUCT_REPO }}
        run: bash -c "$PUSH_TREE" -- out/hosts/product-repo
        shell: bash

      - name: Push the shell-form plugin to the 3.1.0 marketplace repository
        env:
          KEY: ${{ secrets.MARKETPLACE_DEPLOY_KEY }}
          REPO: ${{ vars.MEMORY_MARKETPLACE_REPO }}
        run: bash -c "$PUSH_TREE" -- out/hosts-legacy/claude-code
        shell: bash

      - name: Push the Gemini extension tree
        env:
          KEY: ${{ secrets.GEMINI_DEPLOY_KEY }}
          REPO: ${{ vars.MEMORY_GEMINI_REPO }}
        run: bash -c "$PUSH_TREE" -- out/hosts/gemini
        shell: bash

      # --latest=false: the "Latest" badge stays on ad's own vX.Y.Z release.
      - name: GitHub release with every artifact and SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "memory-v$V" out/dist/* --repo "$GITHUB_REPOSITORY" --title "agent-daemon-memory $V" --latest=false \
            --notes "agent-daemon-memory $V: the npm package (dist-tag $DIST_TAG), its SBOM, the host packages and tools-list.json. Check downloads against SHA256SUMS."

# One script for every generated tree: it replaces the target repository's content
# on its default branch as one commit, and is skipped when not configured.
env:
  PUSH_TREE: |
    set -euo pipefail
    TREE="$1"
    if [ -z "${KEY:-}" ] || [ -z "${REPO:-}" ]; then echo "::notice::deploy key or repository not set: $TREE not pushed"; exit 0; fi
    install -m 700 -d ~/.ssh
    printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
    export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
    WORK="$(mktemp -d)"
    git clone --depth 1 "git@github.com:${REPO}.git" "$WORK"
    find "$WORK" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
    cp -R "$TREE"/. "$WORK"/
    cd "$WORK"
    git add -A
    if git diff --cached --quiet; then echo "no change in $REPO"; exit 0; fi
    git -c user.name="agent-daemon release" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "agent-daemon-memory ${V}"
    git push origin HEAD
    rm -f ~/.ssh/deploy_key
